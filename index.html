            { word: "彼此", lesson: "U7L21", pinyin: "bǐ cǐ", def: "雙方、互相。", sentence: "同學之間應該互相幫助，＿＿關心。" },

            // 第七單元 第二薪課《弟子規——冬則溫》
            { word: "感覺", lesson: "U7L23", pinyin: "gǎn jué", def: "器官對客觀事物的反應，或心中感受。", sentence: "洗完熱水澡後，我覺得＿＿非常舒服。" },
            { word: "悶熱", lesson: "U7L23", pinyin: "mēn rè", def: "天氣氣溫高，空氣不流通。", sentence: "夏天下雨前，天氣總是特別＿＿。" },
            { word: "涼快", lesson: "U7L23", pinyin: "liáng kuai", def: "清涼舒適。", sentence: "樹蔭下非常＿＿，是消暑的好地方。" },
            { word: "安心", lesson: "U7L23", pinyin: "ān xīn", def: "心情安定，沒有顧慮。", sentence: "看到孩子平安無事，媽媽終於＿＿了。" }
        ];

        // State Variables
        let currentMode = '';
        let filteredWords = [];
        let currentGameIndex = 0;
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let matchCards = [];
        let selectedMatchCards = [];
        let isProcessingMatch = false;

        // UI View Switcher
        function showView(viewId) {
            document.getElementById('view-menu').classList.add('hidden');
            document.getElementById('view-game').classList.add('hidden');
            document.getElementById('view-result').classList.add('hidden');
            document.getElementById(viewId).classList.remove('hidden');

            const statsBar = document.getElementById('stats-bar');
            if (viewId === 'view-game') {
                statsBar.classList.remove('hidden');
            } else if (viewId === 'view-menu') {
                statsBar.classList.add('hidden');
                updateVocabPreview();
            }
        }

        // Toggle Word Preview Dropdown
        function toggleVocabList() {
            const container = document.getElementById('vocab-list-container');
            const icon = document.getElementById('vocab-toggle-icon');
            container.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
            updateVocabPreview();
        }

        function updateVocabPreview() {
            const lessonSelect = document.getElementById('lesson-select').value;
            const container = document.getElementById('vocab-list-container');
            const list = lessonSelect === 'ALL' 
                ? wordData 
                : wordData.filter(w => w.lesson === lessonSelect);

            container.innerHTML = list.map(w => `
                <div class="p-2 bg-emerald-50 rounded-lg text-center border border-emerald-100 cursor-pointer hover:bg-emerald-100" onclick="speakText('${w.word}')">
                    <div class="font-bold text-emerald-800">${w.word}</div>
                    <div class="text-[10px] text-emerald-600">${w.pinyin}</div>
                </div>
            `).join('');
        }

        // Filter words based on dropdown selection
        function getSelectedWords() {
            const lesson = document.getElementById('lesson-select').value;
            if (lesson === 'ALL') {
                return [...wordData].sort(() => 0.5 - Math.random());
            } else {
                return wordData.filter(w => w.lesson === lesson).sort(() => 0.5 - Math.random());
            }
        }

        // Start Game Engine
        function startGame(mode) {
            currentMode = mode;
            filteredWords = getSelectedWords();
            
            if (filteredWords.length < 4) {
                alert("該課文詞語數量較少，建議選擇『全部課文綜合挑戰』進行遊戲！");
                return;
            }

            currentGameIndex = 0;
            score = 0;
            combo = 0;
            maxCombo = 0;
            updateStats();
            showView('view-game');
            loadQuestion();
        }

        function updateStats() {
            document.getElementById('score-display').innerHTML = `<i class="fa-solid fa-star mr-1"></i>${score}`;
            document.getElementById('combo-display').innerHTML = `<i class="fa-solid fa-fire mr-1"></i>${combo} 連擊`;
            
            const progress = (currentGameIndex / Math.min(filteredWords.length, 10)) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
        }

        // Load Question Logic
        function loadQuestion() {
            const totalQuestions = Math.min(filteredWords.length, 10);
            if (currentGameIndex >= totalQuestions) {
                endGame();
                return;
            }

            updateStats();
            const currentItem = filteredWords[currentGameIndex];
            const qArea = document.getElementById('question-area');
            const iArea = document.getElementById('interactive-area');

            if (currentMode === 'fill') {
                // Fill in the blank
                const sentenceMasked = currentItem.sentence.replace('＿＿', '<span class="underline underline-offset-8 decoration-4 decoration-emerald-500 font-bold px-2 text-emerald-700">（ ？ ）</span>');
                qArea.innerHTML = `
                    <div class="text-xs font-semibold text-emerald-600 tracking-wider">第 ${currentGameIndex + 1} / ${totalQuestions} 題 • 句子填充</div>
                    <h3 class="text-xl md:text-2xl font-medium leading-relaxed text-gray-800">${sentenceMasked}</h3>
                `;

                // Options (1 correct + 3 distractor)
                const options = generateOptions(currentItem.word);
                iArea.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        ${options.map(opt => `
                            <button onclick="checkAnswer('${opt}', '${currentItem.word}')" class="p-4 bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-200 hover:border-emerald-400 rounded-2xl text-lg font-bold text-emerald-900 transition flex items-center justify-between">
                                <span>${opt}</span>
                                <i class="fa-regular fa-circle-check text-emerald-400"></i>
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (currentMode === 'choice') {
                // Definition Choice
                qArea.innerHTML = `
                    <div class="text-xs font-semibold text-teal-600 tracking-wider">第 ${currentGameIndex + 1} / ${totalQuestions} 題 • 詞義理解</div>
                    <div class="flex items-center space-x-3">
                        <span class="text-3xl font-extrabold text-teal-700">${currentItem.word}</span>
                        <span class="text-sm bg-teal-100 text-teal-800 px-2.5 py-1 rounded-full">${currentItem.pinyin}</span>
                    </div>
                    <p class="text-gray-600">請選出上述詞語的正確解釋：</p>
                `;

                const options = generateDefOptions(currentItem);
                iArea.innerHTML = `
                    <div class="space-y-3">
                        ${options.map(opt => `
                            <button onclick="checkAnswer('${opt.def}', '${currentItem.def}')" class="w-full text-left p-4 bg-teal-50 hover:bg-teal-100 border-2 border-teal-200 hover:border-teal-400 rounded-2xl text-md font-medium text-teal-950 transition">
                                ${opt.def}
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (currentMode === 'match') {
                // Card Match Game (4 pairs per round)
                qArea.innerHTML = `
                    <div class="text-xs font-semibold text-indigo-600 tracking-wider">第 ${currentGameIndex + 1} / ${totalQuestions} 題 • 詞語連線配對</div>
                    <h3 class="text-lg font-bold text-gray-700">翻開卡片，找出配對的詞語與解釋：</h3>
                `;

                setupMatchRound();
            }
        }

        // Option Generators
        function generateOptions(correctWord) {
            const distractors = wordData
                .filter(w => w.word !== correctWord)
                .map(w => w.word)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3);
            return [correctWord, ...distractors].sort(() => 0.5 - Math.random());
        }

        function generateDefOptions(correctItem) {
            const distractors = wordData
                .filter(w => w.word !== correctItem.word)
                .sort(() => 0.5 - Math.random())
                .slice(0, 3);
            return [correctItem, ...distractors].sort(() => 0.5 - Math.random());
        }

        // Matching Game Setup
        function setupMatchRound() {
            isProcessingMatch = false;
            const remainingCount = filteredWords.length - currentGameIndex;
            const pairsInRound = Math.min(3, remainingCount);
            const roundWords = filteredWords.slice(currentGameIndex, currentGameIndex + pairsInRound);
            
            if (roundWords.length === 0) {
                endGame();
                return;
            }

            let cards = [];
            roundWords.forEach((w, idx) => {
                cards.push({ id: idx, type: 'word', text: w.word, pairId: idx });
                cards.push({ id: idx, type: 'def', text: w.def, pairId: idx });
            });
            matchCards = cards.sort(() => 0.5 - Math.random());
            selectedMatchCards = [];

            const iArea = document.getElementById('interactive-area');
            iArea.innerHTML = `
                <div class="mb-3 text-sm text-indigo-700 font-semibold text-center bg-indigo-50 py-2 px-3 rounded-xl border border-indigo-200 shadow-sm flex items-center justify-center">
                    <i class="fa-solid fa-hand-pointer mr-2 text-indigo-500"></i>
                    玩法：點擊一張「詞語卡」，再點擊對應的「解釋卡」進行配對！
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    ${matchCards.map((card, idx) => `
                        <div id="match-card-${idx}" onclick="handleMatchSelect(${idx})" class="h-24 bg-indigo-50 hover:bg-indigo-100 border-2 border-indigo-200 rounded-xl p-3 flex items-center justify-center text-center cursor-pointer transition transform hover:scale-105 font-bold text-indigo-900 text-sm shadow-sm select-none">
                            ${card.text}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function handleMatchSelect(idx) {
            if (isProcessingMatch) return;

            const cardEl = document.getElementById(`match-card-${idx}`);
            if (!cardEl || cardEl.classList.contains('bg-emerald-200') || selectedMatchCards.includes(idx)) return;

            cardEl.classList.remove('bg-indigo-50', 'hover:bg-indigo-100', 'border-indigo-200');
            cardEl.classList.add('border-indigo-600', 'bg-indigo-200', 'ring-2', 'ring-indigo-400');
            selectedMatchCards.push(idx);

            if (selectedMatchCards.length === 2) {
                isProcessingMatch = true;
                const first = matchCards[selectedMatchCards[0]];
                const second = matchCards[selectedMatchCards[1]];

                if (first.pairId === second.pairId && first.type !== second.type) {
                    // Match Success
                    score += 20;
                    combo++;
                    if (combo > maxCombo) maxCombo = combo;
                    
                    const card1 = document.getElementById(`match-card-${selectedMatchCards[0]}`);
                    const card2 = document.getElementById(`match-card-${selectedMatchCards[1]}`);
                    
                    const successClass = "h-24 bg-emerald-200 border-2 border-emerald-500 rounded-xl p-3 flex items-center justify-center text-center font-bold text-emerald-900 text-sm shadow-inner pointer-events-none transition-all";
                    if (card1) card1.className = successClass;
                    if (card2) card2.className = successClass;

                    selectedMatchCards = [];
                    isProcessingMatch = false;
                    updateStats();

                    // Check if all matched
                    const matchedCount = document.querySelectorAll('.pointer-events-none').length;
                    if (matchedCount === matchCards.length) {
                        setTimeout(() => {
                            currentGameIndex += matchCards.length / 2;
                            loadQuestion();
                        }, 600);
                    }
                } else {
                    // Match Failed
                    const card1 = document.getElementById(`match-card-${selectedMatchCards[0]}`);
                    const card2 = document.getElementById(`match-card-${selectedMatchCards[1]}`);
                    if (card1) card1.classList.add('border-red-500', 'bg-red-100');
                    if (card2) card2.classList.add('border-red-500', 'bg-red-100');
                    
                    combo = 0;
                    updateStats();
                    setTimeout(() => {
                        selectedMatchCards.forEach(i => {
                            const el = document.getElementById(`match-card-${i}`);
                            if (el) el.className = "h-24 bg-indigo-50 hover:bg-indigo-100 border-2 border-indigo-200 rounded-xl p-3 flex items-center justify-center text-center cursor-pointer transition transform hover:scale-105 font-bold text-indigo-900 text-sm shadow-sm select-none";
                        });
                        selectedMatchCards = [];
                        isProcessingMatch = false;
                    }, 700);
                }
            }
        }

        // Answer Checking
        function checkAnswer(selected, correct) {
            if (selected === correct) {
                score += 10 + combo * 2;
                combo++;
                if (combo > maxCombo) maxCombo = combo;
                showModal(true, "答對了！太厲害了！", `詞語：<b>${filteredWords[currentGameIndex].word}</b><br>${filteredWords[currentGameIndex].def}`);
            } else {
                combo = 0;
                showModal(false, "差一點點！再接再厲！", `正確答案是：<b>${correct}</b>`);
            }
            updateStats();
        }

        // Speech Synthesis (廣東話)
        function speakCurrentWord() {
            const currentItem = filteredWords[currentGameIndex];
            if (currentItem) {
                speakText(currentItem.word);
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-HK'; // 廣東話
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("你的瀏覽器暫時不支援語音播放。");
            }
        }

        // Modal Control
        function showModal(isCorrect, title, msg) {
            const modal = document.getElementById('feedback-modal');
            const icon = document.getElementById('modal-icon');
            const modalTitle = document.getElementById('modal-title');
            const modalMsg = document.getElementById('modal-msg');

            if (isCorrect) {
                icon.innerHTML = '🎉';
                modalTitle.className = 'text-xl font-bold mb-2 text-emerald-600';
            } else {
                icon.innerHTML = '💡';
                modalTitle.className = 'text-xl font-bold mb-2 text-orange-500';
            }

            modalTitle.innerText = title;
            modalMsg.innerHTML = msg;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('feedback-modal').classList.add('hidden');
            currentGameIndex++;
            loadQuestion();
        }

        // End Game
        function endGame() {
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-combo').innerText = maxCombo;
            showView('view-result');
            
            // Save Score to Firebase Realtime Database
            saveScoreToFirebase();
            // Celebration Confetti
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function saveScoreToFirebase() {
            if (window.firebaseDatabase) {
                // Import Realtime Database functions directly from window or ES module
                import("https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js")
                    .then(({ ref, push, set }) => {
                        const selectedLesson = document.getElementById('lesson-select').value;
                        const scoresRef = ref(window.firebaseDatabase, 'game_scores');
                        const newScoreRef = push(scoresRef);
                        
                        set(newScoreRef, {
                            score: score,
                            maxCombo: maxCombo,
                            mode: currentMode,
                            lesson: selectedLesson,
                            timestamp: Date.now()
                        }).then(() => {
                            console.log("Score saved successfully to Firebase!");
                        }).catch((error) => {
                            console.error("Error saving score to Firebase:", error);
                        });
                    });
            }
        }

        function restartGame() {
            startGame(currentMode);
        }

        function backToMenu() {
            showView('view-menu');
        }

        // Initialize App
        window.onload = function() {
            updateVocabPreview();
        };
    </script>
</body>
</html>
